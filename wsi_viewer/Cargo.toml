[package]
name = "wsi-viewer"
version = "0.1.0"
edition = "2021"
description = "Web viewer for whole-slide images (WSI/CZI) using DZI tile protocol"

[[bin]]
name = "wsi-viewer"
path = "src/main.rs"

# ── Optional features ──────────────────────────────────────────────────────────
# openslide: links against the system libopenslide C library.
#   Adds support for SVS, NDPI, MRXS, SCN, BIF, VMS/VMU, generic TIFF, …
#
# Enabled by default on non-Windows. On Windows (no system openslide),
# build without it for CZI-only support:
#   cargo build --release                         (CZI only)
#   cargo build --release --features openslide    (+ all OpenSlide formats,
#                                                  requires OpenSlide DLLs)
[features]
openslide = ["dep:openslide-rs"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Slide reading – WSI formats via OpenSlide (optional, requires libopenslide)
openslide-rs = { version = "2.4", optional = true }

# Slide reading – CZI (pure Rust, zero native deps, works everywhere)
czi-rs = "0.1"

# Image encoding / manipulation
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "rayon"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
