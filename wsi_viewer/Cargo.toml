[package]
name = "wsi-viewer"
version = "0.1.0"
edition = "2021"
description = "Web viewer for whole-slide images (WSI/CZI) using DZI tile protocol"

[[bin]]
name = "wsi-viewer"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Slide reading – WSI formats (SVS, NDPI, MRXS, SCN, TIFF, …)
openslide-rs = "2.4"

# Slide reading – CZI (pure Rust, no native deps)
czi-rs = "0.1"

# Image encoding / manipulation
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "rayon"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
